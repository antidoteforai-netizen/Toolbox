<svg xmlns="http://www.w3.org/2000/svg" width="420" height="677" viewBox="0 0 360 580" font-family="Raleway, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>La même demande sans harnais et avec harnais : sans lui, l'agent agit et dit « c'est fait » sans filtre, sans trace ni preuve ; avec lui, la porte, le journal et la preuve se placent avant « c'est vérifié »</title>
  <defs>
    <marker id="harnais-fleche-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#161709"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="360" height="580" rx="16" fill="#f3f3ee"/>

  <!-- En-têtes des deux colonnes -->
  <rect x="10" y="14" width="162" height="32" rx="16" fill="#fbfbf4" stroke="#c4451a" stroke-width="1.5"/>
  <rect x="188" y="14" width="162" height="32" rx="16" fill="#f7ef63" stroke="#161709" stroke-width="1.5"/>
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#161709">
    <text x="91" y="35">Sans harnais</text>
    <text x="269" y="35">Avec harnais</text>
  </g>

  <!-- Colonne de gauche : l'action va droit au but, rien ne la contrôle -->
  <g stroke="#161709" stroke-width="1.5" fill="#fbfbf4">
    <rect x="10" y="62" width="162" height="48" rx="10"/>
    <rect x="10" y="130" width="162" height="48" rx="10"/>
    <rect x="10" y="266" width="162" height="48" rx="10"/>
  </g>
  <g stroke="#8a8b80" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <rect x="10" y="198" width="162" height="48" rx="10"/>
    <rect x="10" y="334" width="162" height="48" rx="10"/>
    <rect x="10" y="402" width="162" height="48" rx="10"/>
  </g>
  <rect x="10" y="470" width="162" height="48" rx="10" fill="#fbfbf4" stroke="#c4451a" stroke-width="2.5"/>

  <g text-anchor="middle" font-size="15" font-weight="700" fill="#161709">
    <text x="91" y="83">Vous demandez</text>
    <text x="91" y="151">L'agent agit</text>
    <text x="91" y="287">Le monde réel</text>
    <text x="91" y="491">« C'est fait ! »</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#55564b">
    <text x="91" y="100">une mise en ligne</text>
    <text x="91" y="168">aussitôt</text>
    <text x="91" y="304">fichiers et site</text>
    <text x="91" y="508">à croire sur parole</text>
  </g>
  <!-- Ce qui manque : une croix et trois mots -->
  <g stroke="#c4451a" stroke-width="2" stroke-linecap="round">
    <path d="M38,218 l8,8 M46,218 l-8,8"/>
    <path d="M38,354 l8,8 M46,354 l-8,8"/>
    <path d="M38,422 l8,8 M46,422 l-8,8"/>
  </g>
  <g font-size="13" fill="#55564b">
    <text x="58" y="227">aucun filtre</text>
    <text x="58" y="363">aucune trace</text>
    <text x="58" y="431">aucune preuve</text>
  </g>

  <!-- Colonne de droite : trois contrôles s'intercalent -->
  <g stroke="#161709" stroke-width="1.5">
    <rect x="188" y="62" width="162" height="48" rx="10" fill="#fbfbf4"/>
    <rect x="188" y="130" width="162" height="48" rx="10" fill="#fbfbf4"/>
    <rect x="188" y="198" width="162" height="48" rx="10" fill="#f7ef63"/>
    <rect x="188" y="266" width="162" height="48" rx="10" fill="#fbfbf4"/>
    <rect x="188" y="334" width="162" height="48" rx="10" fill="#f7ef63"/>
    <rect x="188" y="402" width="162" height="48" rx="10" fill="#f7ef63"/>
  </g>
  <rect x="188" y="470" width="162" height="48" rx="10" fill="#deed9c" stroke="#0c8c7d" stroke-width="2.5"/>

  <g text-anchor="middle" font-size="15" font-weight="700" fill="#161709">
    <text x="269" y="83">Vous demandez</text>
    <text x="269" y="151">L'agent veut agir</text>
    <text x="269" y="219">La porte</text>
    <text x="269" y="287">Le monde réel</text>
    <text x="269" y="355">Le journal</text>
    <text x="269" y="423">La preuve</text>
    <text x="269" y="491">« C'est vérifié »</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#55564b">
    <text x="269" y="100">une mise en ligne</text>
    <text x="269" y="168">il prépare l'action</text>
    <text x="269" y="236">refuse le dangereux</text>
    <text x="269" y="304">fichiers et site</text>
    <text x="269" y="372">garde chaque action</text>
    <text x="269" y="440">un test qui passe</text>
    <text x="269" y="508">sinon : UNKNOWN</text>
  </g>

  <!-- Numéros des trois contrôles, posés sur le coin de leur case -->
  <g fill="#161709">
    <circle cx="194" cy="203" r="11"/>
    <circle cx="194" cy="339" r="11"/>
    <circle cx="194" cy="407" r="11"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#fbfbf4">
    <text x="194" y="208">1</text>
    <text x="194" y="344">2</text>
    <text x="194" y="412">3</text>
  </g>

  <!-- Flèches : une étape mène à la suivante, dans chaque colonne -->
  <g stroke="#161709" stroke-width="1.5" fill="none" marker-end="url(#harnais-fleche-3)">
    <line x1="91" y1="110" x2="91" y2="129"/>
    <line x1="91" y1="178" x2="91" y2="197"/>
    <line x1="91" y1="246" x2="91" y2="265"/>
    <line x1="91" y1="314" x2="91" y2="333"/>
    <line x1="91" y1="382" x2="91" y2="401"/>
    <line x1="91" y1="450" x2="91" y2="469"/>
    <line x1="269" y1="110" x2="269" y2="129"/>
    <line x1="269" y1="178" x2="269" y2="197"/>
    <line x1="269" y1="246" x2="269" y2="265"/>
    <line x1="269" y1="314" x2="269" y2="333"/>
    <line x1="269" y1="382" x2="269" y2="401"/>
    <line x1="269" y1="450" x2="269" y2="469"/>
  </g>

  <!-- Légende -->
  <rect x="12" y="532" width="14" height="14" rx="3" fill="#f7ef63" stroke="#161709" stroke-width="1"/>
  <rect x="12" y="554" width="14" height="14" rx="3" fill="none" stroke="#8a8b80" stroke-width="1.5" stroke-dasharray="3 2"/>
  <g font-size="13" fill="#161709">
    <text x="34" y="544">En jaune, ce que le harnais ajoute</text>
    <text x="34" y="566">En pointillés, ce qui manque sans lui</text>
  </g>
</svg>
