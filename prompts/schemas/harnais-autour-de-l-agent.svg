<svg xmlns="http://www.w3.org/2000/svg" width="420" height="672" viewBox="0 0 360 576" font-family="Raleway, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Le harnais entoure l'agent : la porte filtre chaque action, le journal garde la trace et la preuve, le voyant montre les angles morts</title>
  <defs>
    <marker id="harnais-fleche-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#161709"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="360" height="576" rx="16" fill="#f3f3ee"/>

  <!-- Le chemin d'une action, de haut en bas -->
  <g stroke="#161709" stroke-width="1.5">
    <rect x="20" y="20" width="150" height="50" rx="10" fill="#fbfbf4"/>
    <rect x="20" y="104" width="260" height="50" rx="10" fill="#fbfbf4"/>
    <rect x="20" y="188" width="260" height="64" rx="10" fill="#f7ef63"/>
    <rect x="20" y="286" width="260" height="50" rx="10" fill="#fbfbf4"/>
    <rect x="20" y="370" width="260" height="64" rx="10" fill="#f7ef63"/>
    <rect x="20" y="468" width="260" height="64" rx="10" fill="#f7ef63"/>
  </g>

  <g text-anchor="middle" font-size="15" font-weight="700" fill="#161709">
    <text x="95" y="41">Vous</text>
    <text x="150" y="125">L'agent</text>
    <text x="150" y="210">La porte</text>
    <text x="150" y="307">Le monde réel</text>
    <text x="150" y="392">Le journal</text>
    <text x="150" y="490">Le voyant</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#55564b">
    <text x="95" y="59">demandez et décidez</text>
    <text x="150" y="143">Claude Code, par exemple</text>
    <text x="150" y="228">des règles écrites, sans IA</text>
    <text x="150" y="245">un hook lancé avant chaque action</text>
    <text x="150" y="325">fichiers, terminal, site en ligne</text>
    <text x="150" y="410">chaque action, refus compris</text>
    <text x="150" y="508">ce que rien n'a vérifié</text>
    <text x="150" y="525">calculé, jamais écrit à la main</text>
  </g>
  <text x="150" y="427" text-anchor="middle" font-size="13" fill="#55564b" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">harnais/cas/</text>

  <!-- Flèches -->
  <g stroke="#161709" stroke-width="1.5" fill="none" marker-end="url(#harnais-fleche-1)">
    <line x1="95" y1="70" x2="95" y2="103"/>
    <line x1="110" y1="154" x2="110" y2="187"/>
    <line x1="190" y1="188" x2="190" y2="155"/>
    <line x1="150" y1="252" x2="150" y2="285"/>
    <line x1="150" y1="336" x2="150" y2="369"/>
    <line x1="150" y1="434" x2="150" y2="467"/>
    <polyline points="280,500 330,500 330,54 171,54"/>
  </g>

  <g font-size="13" fill="#161709">
    <text x="105" y="91">une demande</text>
    <text x="102" y="175" text-anchor="end">veut agir</text>
    <text x="198" y="175">refuse</text>
    <text x="160" y="273">autorise</text>
    <text x="160" y="357">la preuve</text>
    <text x="160" y="455">nourrit</text>
    <text x="250" y="31" text-anchor="middle">vous montre</text>
    <text x="250" y="46" text-anchor="middle">les angles morts</text>
  </g>

  <!-- Légende -->
  <rect x="20" y="548" width="14" height="14" rx="3" fill="#f7ef63" stroke="#161709" stroke-width="1"/>
  <text x="42" y="560" font-size="13" fill="#161709">En jaune, ce que le harnais ajoute</text>
</svg>
