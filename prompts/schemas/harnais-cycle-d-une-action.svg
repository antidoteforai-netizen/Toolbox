<svg xmlns="http://www.w3.org/2000/svg" width="420" height="548" viewBox="0 0 360 470" font-family="Raleway, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Le cycle de vie d'une action : six états, trois sorties négatives, et la différence entre DEPLOYED et VERIFIED</title>
  <defs>
    <marker id="harnais-fleche-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#161709"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="360" height="470" rx="16" fill="#f3f3ee"/>

  <!-- Le chemin normal, de haut en bas -->
  <g stroke="#161709" stroke-width="1.5">
    <rect x="12" y="16" width="172" height="46" rx="10" fill="#fbfbf4"/>
    <rect x="12" y="84" width="172" height="46" rx="10" fill="#fbfbf4"/>
    <rect x="12" y="152" width="172" height="46" rx="10" fill="#fbfbf4"/>
    <rect x="12" y="220" width="172" height="46" rx="10" fill="#fbfbf4"/>
    <rect x="12" y="288" width="172" height="46" rx="10" fill="#f7ef63"/>
  </g>
  <rect x="12" y="356" width="172" height="46" rx="10" fill="#deed9c" stroke="#0c8c7d" stroke-width="2.5"/>

  <g text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#161709">
    <text x="98" y="36">DRAFT</text>
    <text x="98" y="104">PROPOSED</text>
    <text x="98" y="172">APPROVED</text>
    <text x="98" y="240">EXECUTING</text>
    <text x="98" y="308">DEPLOYED</text>
    <text x="98" y="376">VERIFIED</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#55564b">
    <text x="98" y="53">la demande en brouillon</text>
    <text x="98" y="121">l'agent propose</text>
    <text x="98" y="189">l'action est acceptée</text>
    <text x="98" y="257">l'action s'exécute</text>
    <text x="98" y="325" fill="#161709">l'agent dit « fini »</text>
    <text x="98" y="393" fill="#161709">une preuve le confirme</text>
  </g>

  <!-- Les sorties négatives -->
  <g fill="#fbfbf4" stroke="#c4451a" stroke-width="2.5">
    <rect x="224" y="84" width="124" height="46" rx="10"/>
    <rect x="224" y="220" width="124" height="46" rx="10"/>
    <rect x="224" y="288" width="124" height="46" rx="10"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="700" letter-spacing="0.5" fill="#161709">
    <text x="286" y="104">REJECTED</text>
    <text x="286" y="240">FAILED</text>
    <text x="286" y="308">UNVERIFIED</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#55564b">
    <text x="286" y="121">refusée à temps</text>
    <text x="286" y="257">elle a échoué</text>
    <text x="286" y="325">preuve contraire</text>
  </g>

  <!-- Flèches -->
  <g stroke="#161709" stroke-width="1.5" fill="none" marker-end="url(#harnais-fleche-2)">
    <line x1="98" y1="62" x2="98" y2="83"/>
    <line x1="98" y1="130" x2="98" y2="151"/>
    <line x1="98" y1="198" x2="98" y2="219"/>
    <line x1="98" y1="266" x2="98" y2="287"/>
    <line x1="98" y1="334" x2="98" y2="355"/>
    <line x1="184" y1="107" x2="223" y2="107"/>
    <line x1="184" y1="243" x2="223" y2="243"/>
    <line x1="184" y1="311" x2="223" y2="311"/>
  </g>
  <text x="108" y="349" font-size="13" fill="#161709">le harnais vérifie</text>

  <!-- Légende -->
  <rect x="12" y="420" width="14" height="14" rx="3" fill="#fbfbf4" stroke="#c4451a" stroke-width="2"/>
  <rect x="12" y="442" width="14" height="14" rx="3" fill="#deed9c" stroke="#0c8c7d" stroke-width="2"/>
  <g font-size="13" fill="#161709">
    <text x="34" y="432">Les trois sorties négatives</text>
    <text x="34" y="454">Le seul état prouvé</text>
  </g>
</svg>
