<svg xmlns="http://www.w3.org/2000/svg" width="420" height="642" viewBox="0 0 360 550" font-family="Raleway, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Le parcours en quatre étapes sur deux couloirs : le prestataire envoie le kit, le client rédige le brief avec son propre assistant puis renvoie quatre à huit fichiers étiquetés, le prestataire vérifie avant le rendez-vous, et le premier rendez-vous porte sur les vrais écarts</title>
  <defs>
    <marker id="brief3-fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0c8c7d"/>
    </marker>
  </defs>
  <style>

    @media (prefers-reduced-motion: reduce) { .b3-bit { display: none; } .b3-anim { animation: none !important; } }
  </style>
  <rect x="0" y="0" width="360" height="550" rx="16" fill="#fbfbf4"/>

  <!-- Les deux couloirs -->
  <rect x="10" y="10" width="164" height="440" rx="14" fill="#f3f3ee"/>
  <rect x="186" y="10" width="164" height="440" rx="14" fill="#f3f3ee"/>
  <g text-anchor="middle">
    <text x="92" y="36" font-size="15" font-weight="700" fill="#161709">Prestataire</text>
    <text x="92" y="53" font-size="13" fill="#55564b">freelance ou agence</text>
    <text x="268" y="36" font-size="15" font-weight="700" fill="#161709">Client</text>
    <text x="268" y="53" font-size="13" fill="#55564b">avec son assistant</text>
  </g>

  <!-- Étape 1, côté prestataire -->
  <rect x="20" y="70" width="144" height="82" rx="12" fill="#ffffff" stroke="#161709" stroke-width="1.5"/>
  <text x="34" y="92" font-size="13" font-weight="700" fill="#0c8c7d">1</text>
  <text x="34" y="112" font-size="14" font-weight="700" fill="#161709">Envoie le kit</text>
  <text x="34" y="130" font-size="13" fill="#55564b">tutoriel, prompts</text>
  <text x="34" y="146" font-size="13" fill="#55564b">et confidentialité</text>

  <!-- Étape 2, côté client -->
  <rect x="196" y="150" width="144" height="98" rx="12" fill="#ffffff" stroke="#161709" stroke-width="1.5"/>
  <text x="210" y="172" font-size="13" font-weight="700" fill="#0c8c7d">2</text>
  <text x="210" y="192" font-size="14" font-weight="700" fill="#161709">Rédige avec</text>
  <text x="210" y="209" font-size="14" font-weight="700" fill="#161709">son assistant</text>
  <text x="210" y="227" font-size="13" fill="#55564b">il propose,</text>
  <text x="210" y="242" font-size="13" fill="#55564b">le client corrige</text>

  <!-- Étape 3, côté client -->
  <rect x="196" y="270" width="144" height="98" rx="12" fill="#ffffff" stroke="#161709" stroke-width="1.5"/>
  <text x="210" y="292" font-size="13" font-weight="700" fill="#0c8c7d">3</text>
  <text x="210" y="312" font-size="14" font-weight="700" fill="#161709">Renvoie 4 à 8</text>
  <text x="210" y="329" font-size="14" font-weight="700" fill="#161709">fichiers</text>
  <rect x="210" y="340" width="12" height="12" rx="6" fill="#d9ebe7"/>
  <rect x="226" y="340" width="12" height="12" rx="6" fill="#c8dcff"/>
  <rect x="242" y="340" width="12" height="12" rx="6" fill="#fff1b8"/>
  <rect x="258" y="340" width="12" height="12" rx="6" fill="#e8e8e3"/>
  <text x="276" y="351" font-size="13" fill="#55564b">étiquetés</text>

  <!-- Étape 4, côté prestataire -->
  <rect x="20" y="330" width="144" height="98" rx="12" fill="#ffffff" stroke="#161709" stroke-width="1.5"/>
  <text x="34" y="352" font-size="13" font-weight="700" fill="#0c8c7d">4</text>
  <text x="34" y="372" font-size="14" font-weight="700" fill="#161709">Vérifie avant</text>
  <text x="34" y="389" font-size="14" font-weight="700" fill="#161709">le rendez-vous</text>
  <text x="34" y="407" font-size="13" fill="#55564b">verdict, trous,</text>
  <text x="34" y="423" font-size="13" fill="#55564b">contradictions</text>

  <!-- Les passages d'un couloir à l'autre -->
  <g fill="none" stroke="#0c8c7d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#brief3-fleche)">
    <path d="M164,111 C190,111 170,199 192,199"/>
    <path d="M268,248 L268,266"/>
    <path d="M196,319 C172,319 186,379 168,379"/>
    <path d="M92,428 L92,470"/>
  </g>

  <!-- Le résultat -->
  <rect x="10" y="474" width="340" height="62" rx="14" fill="#161709"/>
  <text x="26" y="500" font-size="14" font-weight="700" fill="#fbfbf4">Premier rendez-vous</text>
  <text x="26" y="521" font-size="13" fill="#f7ef63">consacré aux vrais écarts</text>
  <rect class="b3-bit" x="-3" y="-3" width="6" height="6" rx="1.5" fill="#161709" opacity="0">
    <animateMotion dur="2.0s" begin="0.0s" repeatCount="indefinite" path="M164,111 C190,111 170,199 192,199"/>
    <animate attributeName="opacity" dur="2.0s" begin="0.0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </rect>
  <rect class="b3-bit" x="-3" y="-3" width="6" height="6" rx="1.5" fill="#161709" opacity="0">
    <animateMotion dur="2.0s" begin="1.0s" repeatCount="indefinite" path="M268,248 L268,266"/>
    <animate attributeName="opacity" dur="2.0s" begin="1.0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </rect>
  <rect class="b3-bit" x="-3" y="-3" width="6" height="6" rx="1.5" fill="#161709" opacity="0">
    <animateMotion dur="2.0s" begin="2.0s" repeatCount="indefinite" path="M196,319 C172,319 186,379 168,379"/>
    <animate attributeName="opacity" dur="2.0s" begin="2.0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </rect>
  <rect class="b3-bit" x="-3" y="-3" width="6" height="6" rx="1.5" fill="#161709" opacity="0">
    <animateMotion dur="2.0s" begin="3.0s" repeatCount="indefinite" path="M92,428 L92,470"/>
    <animate attributeName="opacity" dur="2.0s" begin="3.0s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.8;1"/>
  </rect>
</svg>
