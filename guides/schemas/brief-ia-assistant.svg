<svg xmlns="http://www.w3.org/2000/svg" width="420" height="583" viewBox="0 0 360 500" font-family="Raleway, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>La fenêtre de l'assistant du client : il demande le fichier du projet, l'assistant rédige 02-projet.md avec une étiquette au bout de chaque ligne, et une carte posée à côté liste les questions qui restent à trancher</title>
  <defs>
    <clipPath id="brief2-scene"><rect x="0" y="0" width="360" height="500" rx="16"/></clipPath>
  </defs>
  <style>
    @keyframes b2-clignote { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .b2-curseur { animation: b2-clignote 1.1s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .b2-bit { display: none; } .b2-anim { animation: none !important; } }
  </style>
  <g clip-path="url(#brief2-scene)">
    <rect x="0" y="0" width="360" height="500" fill="#e8e8e3"/>

    <!-- La fenêtre de l'assistant : elle sort du cadre à droite et en bas -->
    <rect x="14" y="18" width="400" height="520" rx="14" fill="#fbfbf4" stroke="#cdcdc8" stroke-width="1"/>
    <line x1="14" y1="56" x2="414" y2="56" stroke="#cdcdc8" stroke-width="1"/>
    <circle cx="36" cy="37" r="9" fill="#c8dcff"/>
    <text x="52" y="42" font-size="13" font-weight="700" fill="#161709">Votre assistant</text>
    <rect x="268" y="33" width="44" height="8" rx="4" fill="#e8e8e3"/>
    <rect x="320" y="33" width="28" height="8" rx="4" fill="#e8e8e3"/>

    <!-- La demande du client -->
    <rect x="132" y="70" width="204" height="34" rx="17" fill="#161709"/>
    <text x="234" y="92" font-size="13" fill="#fbfbf4" text-anchor="middle">Rédige le fichier 02-projet.</text>

    <!-- La réponse de l'assistant -->
    <circle cx="36" cy="128" r="9" fill="#c8dcff"/>
    <text x="52" y="132" font-size="13" fill="#161709">Voici le fichier, étiqueté ligne par ligne.</text>

    <rect x="30" y="148" width="300" height="226" rx="12" fill="#ffffff" stroke="#cdcdc8" stroke-width="1"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">
      <text x="46" y="172" font-size="13" fill="#161709">02-projet.md</text>
      <text x="314" y="172" font-size="12.5" fill="#8a8b80" text-anchor="end">brouillon</text>
    </g>
    <line x1="30" y1="184" x2="330" y2="184" stroke="#e8e8e3" stroke-width="1"/>

    <g font-size="13">
      <text x="46" y="206" font-weight="700" fill="#161709">Objectif</text>
      <text x="46" y="223" fill="#55564b">Commandes en ligne</text>
      <text x="46" y="252" font-weight="700" fill="#161709">Budget</text>
      <text x="46" y="269" fill="#55564b">Environ 6 000 €</text>
      <text x="46" y="298" font-weight="700" fill="#161709">Décideur final</text>
      <text x="46" y="315" fill="#55564b">La gérante</text>
      <text x="46" y="344" font-weight="700" fill="#161709">Critères de succès</text>
      <text x="46" y="361" fill="#55564b">À préciser</text>
    </g>
    <g stroke="#f3f3ee" stroke-width="1">
      <line x1="46" y1="234" x2="314" y2="234"/>
      <line x1="46" y1="280" x2="314" y2="280"/>
      <line x1="46" y1="326" x2="314" y2="326"/>
    </g>
    <!-- Une étiquette au bout de chaque ligne -->
    <rect x="240" y="202" width="76" height="22" rx="11" fill="#d9ebe7"/>
    <rect x="246" y="248" width="70" height="22" rx="11" fill="#c8dcff"/>
    <rect x="254" y="294" width="62" height="22" rx="11" fill="#fff1b8"/>
    <rect x="246" y="340" width="70" height="22" rx="11" fill="#e8e8e3"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#161709" text-anchor="middle">
      <text x="278" y="217.5">confirmé</text>
      <text x="281" y="263.5">mémoire</text>
      <text x="285" y="309.5">déduit</text>
      <text x="281" y="355.5">inconnu</text>
    </g>

    <!-- La zone de saisie, qui sort du cadre -->
    <rect x="30" y="476" width="400" height="36" rx="18" fill="#ffffff" stroke="#cdcdc8" stroke-width="1"/>
    <rect x="48" y="490" width="96" height="8" rx="4" fill="#e8e8e3"/>
    <rect class="b2-anim b2-curseur" x="150" y="485" width="2" height="18" rx="1" fill="#161709"/>

    <!-- La carte satellite : les questions qui restent, à cheval sur le bord -->
    <rect x="152" y="392" width="230" height="78" rx="12" fill="#161709" opacity="0.08" transform="translate(0 4)"/>
    <rect x="148" y="390" width="230" height="78" rx="12" fill="#fbfbf4" stroke="#161709" stroke-width="1.5"/>
    <rect x="148" y="390" width="6" height="78" rx="3" fill="#f7ef63"/>
    <text x="166" y="412" font-size="13" font-weight="700" fill="#161709">Questions pour compléter</text>
    <g font-size="13" fill="#161709">
      <text x="166" y="433">1. Combien de commandes ?</text>
      <text x="166" y="454">2. Qui gère le domaine ?</text>
    </g>
  </g>
</svg>
